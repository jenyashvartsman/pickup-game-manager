<aside class="sidebar" [class.sidebar--open]="isOpen()">
  <div class="sidebar__brand">
    <a class="sidebar__logo" routerLink="/dashboard" (click)="onNavLinkClick()">
      <svg class="sidebar__logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
        <path d="M2 12h20"/>
      </svg>
      <span class="sidebar__logo-text">Pickup FC</span>
    </a>
  </div>

  <nav class="sidebar__nav" aria-label="Main navigation">
    <a
      class="sidebar__nav-link"
      routerLink="/dashboard"
      routerLinkActive="sidebar__nav-link--active"
      (click)="onNavLinkClick()"
    >
      <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span class="sidebar__nav-label">Dashboard</span>
    </a>

    <a
      class="sidebar__nav-link"
      routerLink="/games"
      routerLinkActive="sidebar__nav-link--active"
      (click)="onNavLinkClick()"
    >
      <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="sidebar__nav-label">Calendar</span>
    </a>

    <a
      class="sidebar__nav-link"
      routerLink="/players"
      routerLinkActive="sidebar__nav-link--active"
      (click)="onNavLinkClick()"
    >
      <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      <span class="sidebar__nav-label">Players</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <button
      class="sidebar__theme-toggle"
      (click)="themeService.toggle()"
      [attr.aria-label]="'Switch to ' + (themeService.theme() === 'theme-dark' ? 'light' : 'dark') + ' theme'"
    >
      @if (themeService.theme() === 'theme-dark') {
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <span class="sidebar__nav-label">Light mode</span>
      } @else {
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        <span class="sidebar__nav-label">Dark mode</span>
      }
    </button>
  </div>
</aside>
