<div class="top-players-card">
  <header class="top-players-card__header">
    <h2 class="top-players-card__title">Top Players</h2>
    <a class="top-players-card__view-all" routerLink="/players">View all</a>
  </header>

  @if (players().length === 0) {
    <p class="top-players-card__empty">No player stats recorded yet.</p>
  } @else {
    <ol class="top-players-card__list">
      @for (player of players(); track player.id; let rank = $index) {
        <li class="top-players-card__item">
          <a class="top-players-card__link" [routerLink]="['/players', player.id]">
            <span class="top-players-card__rank">{{ rank + 1 }}</span>
            <span class="top-players-card__name">{{ player.name }}</span>
            <span class="top-players-card__position">{{ player.position }}</span>
            <span class="top-players-card__stats">
              <span class="top-players-card__stat">
                <span class="top-players-card__stat-value">{{ player.totalGoals }}</span>
                <span class="top-players-card__stat-label">G</span>
              </span>
              <span class="top-players-card__stat">
                <span class="top-players-card__stat-value">{{ player.totalAssists }}</span>
                <span class="top-players-card__stat-label">A</span>
              </span>
            </span>
          </a>
        </li>
      }
    </ol>
  }
</div>
